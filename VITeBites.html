<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VITeBites — Campus Pre-Order & Queue System</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#E23744;--red2:#C41E2E;--ink:#1C1C1C;--mut:#6B6B6B;--line:#EFE6D9;--bg:#FDF7F0;--card:#fff;
 --veg:#0F8A0F;--nv:#E23744;--ok:#129E5C;--warn:#E8A33D;--bad:#E23744}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Lexend,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.btn{background:var(--red);color:#fff;border-radius:10px;padding:12px 22px;font-weight:700;font-size:13px;letter-spacing:.4px;transition:.18s}
.btn:hover{background:var(--red2);transform:translateY(-1px);box-shadow:0 8px 20px rgba(226,55,68,.3)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.g{background:#fff;color:var(--red);border:2px solid var(--red)}
.btn.g:hover{background:var(--red);color:#fff}
.btn.s{padding:8px 14px;font-size:12px;border-radius:8px}
.btn.gray{background:#EFEAE2;color:var(--ink)}.btn.gray:hover{background:#E4DDD2;box-shadow:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.mut{color:var(--mut)}.sm{font-size:12px}.xs{font-size:11px}
.pill{border-radius:20px;padding:4px 11px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.dot{width:15px;height:15px;border:2px solid;border-radius:3px;display:inline-grid;place-items:center;flex:none}
.dot::after{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.veg{color:var(--veg)}.nv{color:var(--nv)}.egg{color:#D99400}
/* nav */
nav.top{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800;letter-spacing:-.5px}
.logo i{width:28px;height:28px;background:var(--red);border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;font-style:normal}
.cartbtn{position:relative}
.cartbtn b{position:absolute;top:-6px;right:-8px;background:var(--red);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* landing */
.hero{padding:56px 0 40px;text-align:center}
.hero h1{font-size:clamp(34px,5.2vw,60px);font-weight:900;line-height:1.05;letter-spacing:-2px}
.hero h1 span{color:var(--red)}
.hero p{margin:14px auto 26px;max-width:520px;color:var(--mut);font-weight:300;font-size:16px;line-height:1.65}
.street{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:34px 0}
.shop{position:relative;border-radius:16px;overflow:hidden;text-align:left;color:#fff;padding:20px;min-height:150px;
 display:flex;flex-direction:column;justify-content:flex-end;transition:.45s cubic-bezier(.22,1,.36,1)}
.shop:hover{transform:translateY(-10px) scale(1.02);box-shadow:0 22px 44px rgba(120,60,20,.28)}
.shop b{font-size:19px;font-weight:800;display:block}
.shop s{text-decoration:none;font-size:12px;opacity:.9;font-weight:300}
.shop .go{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.24);display:grid;place-items:center;transition:.3s}
.shop:hover .go{background:#fff;color:var(--ink);transform:translateX(3px)}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:34px 0 60px}
.feat{padding:18px}.feat b{display:block;font-size:14px;margin-bottom:4px}.feat span{font-size:12px;color:var(--mut);line-height:1.5;font-weight:300}
/* menu */
.mhead{padding:22px 0 14px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 15px;font-size:12.5px;font-weight:600;transition:.2s}
.cat.on{background:var(--red);color:#fff;border-color:var(--red)}
.item{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.item.out{opacity:.45}
.item .l{flex:1;min-width:0}
.item h4{font-size:14.5px;font-weight:600;margin:5px 0 3px}
.qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--red);border-radius:9px;overflow:hidden}
.qty button{width:30px;height:32px;color:var(--red);font-weight:800;font-size:15px}
.qty span{width:26px;text-align:center;font-weight:700;font-size:13px;color:var(--red)}
.szs{display:flex;gap:6px;margin-top:7px}
.sz{border:1.5px solid var(--line);border-radius:7px;padding:4px 10px;font-size:11px;font-weight:600}
.sz.on{border-color:var(--red);background:#FFF3F3;color:var(--red)}
/* cart bar */
.cbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;
 border-radius:14px;padding:13px 18px;display:flex;align-items:center;gap:20px;box-shadow:0 14px 40px rgba(0,0,0,.32);min-width:min(560px,92vw)}
/* token */
.tok{text-align:center;padding:30px 20px}
.tok .t{font-size:52px;font-weight:900;letter-spacing:-2px;color:var(--red);line-height:1}
.steps{display:flex;margin:26px 0}
.step{flex:1;text-align:center;position:relative;font-size:11px;font-weight:600;color:var(--mut)}
.step i{display:block;width:26px;height:26px;border-radius:50%;background:#EFEAE2;margin:0 auto 7px;font-style:normal;
 display:grid;place-items:center;font-size:12px;color:#fff;transition:.4s}
.step.done i{background:var(--ok)}.step.now i{background:var(--red);animation:pulse 1.6s infinite}
.step.done,.step.now{color:var(--ink)}
.step:not(:last-child)::after{content:'';position:absolute;top:13px;left:60%;right:-40%;height:2px;background:#EFEAE2}
.step.done::after{background:var(--ok)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(226,55,68,.55)}70%{box-shadow:0 0 0 12px rgba(226,55,68,0)}}
/* vendor */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ord{padding:15px;border-left:5px solid var(--red)}
.ord.preparing{border-left-color:var(--warn)}.ord.ready{border-left-color:var(--ok)}
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.kcard{border:3px solid var(--ok);border-radius:16px;padding:16px;background:#fff;transition:.4s}
.kcard.amber{border-color:var(--warn)}.kcard.red{border-color:var(--bad);animation:pulse2 1.8s infinite}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 0 rgba(226,55,68,.4)}70%{box-shadow:0 0 0 14px rgba(226,55,68,0)}}
.kcard h3{font-size:30px;font-weight:900;letter-spacing:-1px}
.kitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:17px;font-weight:600}
.kitem.done{opacity:.4;text-decoration:line-through}
.tabs{display:flex;gap:6px;background:#EFEAE2;padding:4px;border-radius:11px}
.tab{padding:8px 18px;border-radius:8px;font-size:12.5px;font-weight:700;transition:.2s}
.tab.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.09)}
.fld{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;background:#fff}
.fld:focus{outline:none;border-color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(20,12,8,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.sheet{background:#fff;border-radius:20px;width:min(460px,100%);padding:26px;max-height:86vh;overflow:auto}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;
 border-radius:10px;font-size:13px;font-weight:500;z-index:200;animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-14px)}}
.empty{text-align:center;padding:56px 20px;color:var(--mut)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px}
@media(max-width:640px){.hero h1{letter-spacing:-1px}.cbar{min-width:94vw}}
</style>
</head>

function itm(v,ci,ii){const c=v.cats[ci],a=c.i[ii];
 return{v:v.id,cat:c.n,n:a[0],p:a[1],t:a[2],prep:a[3]||5,pc:a[4]||0,sm:a[5]||0,lg:a[6]||0,k:key(v.id,c.n,a[0])}}

/* ── WAIT-TIME ENGINE ──
   window start = now + (queue backlog / 2 parallel stations) + this order's own prep,
   rounded up to the next 5-minute slot. Backlog counts only unfinished work. */
function backlog(vid){
 return DB.orders.filter(o=>o.v===vid&&(o.st==='placed'||o.st==='preparing'))
  .reduce((s,o)=>s+o.it.reduce((a,i)=>a+(i.done?0:i.prep*i.q),0),0)}
function estimate(vid,items){
 const own=items.reduce((a,i)=>a+i.prep*i.q,0);
 const mins=Math.max(4,Math.round(backlog(vid)/2+own*.6));
 const start=Math.ceil((now()+mins*60000)/300000)*300000;
 return{start,end:start+300000,mins}}
function aheadOf(o){return DB.orders.filter(x=>x.v===o.v&&x.id!==o.id&&(x.st==='placed'||x.st==='preparing')&&x.at<o.at).length}
function crowd(vid){const n=DB.orders.filter(o=>o.v===vid&&(o.st==='placed'||o.st==='preparing')).length;
 return n<4?['Low',' #129E5C']:n<=9?['Moderate','#E8A33D']:['Busy','#E23744']}
function price(i,sz){return i.sm?(sz==='lg'?i.lg:i.sm):i.p}
function disc(k){return DB.flash[k]||0}
function eff(i,sz){const p=price(i,sz),d=disc(i.k);return d?Math.round(p*(100-d)/100):p}
function isClosed(v){if(DB.closed[v.id])return true;const[h,m]=v.close.split(':').map(Number);const d=new Date();return d.getHours()*60+d.getMinutes()>h*60+m}
function canFlash(v){const[h,m]=v.close.split(':').map(Number);const d=new Date(),cur=d.getHours()*60+d.getMinutes(),cl=h*60+m;return cur>=cl-45&&cur<=cl}

 const q=DB.orders.filter(o=>o.v===v.id&&['placed','preparing','ready'].includes(o.st)).sort((a,b)=>a.at-b.at);
 const done=DB.orders.filter(o=>o.v===v.id&&o.st==='completed').length;
 const sold=Object.entries(DB.orders.filter(o=>o.v===v.id).reduce((m,o)=>{o.it.forEach(i=>m[i.n]=(m[i.n]||0)+i.q);return m},{})).sort((a,b)=>b[1]-a[1]).slice(0,5);
 return cafeShell(`<div class="wrap" style="padding-top:18px;padding-bottom:60px">
  <div class="row sp" style="flex-wrap:wrap;gap:10px;margin-bottom:16px">
   <div class="row" style="gap:8px">
    <span class="pill" style="background:#F4F1EB">${q.length} live</span>
    <span class="pill" style="background:#F4F1EB">${done} done today</span>
    <span class="pill" style="background:#F4F1EB">~${estimate(v.id,[{prep:6,q:1}]).mins} min quote</span>
   </div>
   <button class="btn s ${DB.closed[v.id]?'':'gray'}" onclick="toggleClosed()">${DB.closed[v.id]?'REOPEN OUTLET':'MARK CLOSED'}</button>
  </div>
  <div class="vgrid">
   ${q.length?q.map(o=>`<div class="card ord ${o.st}">
    <div class="row sp"><b style="font-size:20px">${o.tok}</b>
     <span class="xs mut">${Math.round((now()-o.at)/60000)} min ago</span></div>
    <div class="xs mut" style="margin:2px 0 9px">${esc(o.un)} · pickup ${hhmm(o.w0)}–${hhmm(o.w1)} ${o.head?'· 🚶 on the way':''}</div>
    ${o.it.map(i=>`<div class="sm" style="padding:2px 0"><span class="dot ${i.t==='veg'?'veg':i.t==='egg'?'egg':'nv'}" style="vertical-align:-2px"></span>
      <span style="margin-left:5px">${esc(i.n)}${i.sm?' ('+(i.sz==='lg'?'L':'S')+')':''} × ${i.q}</span></div>`).join('')}
    <div class="row sp" style="margin-top:11px"><b class="sm">₹${o.tot}</b>
     ${o.st==='placed'?`<button class="btn s" onclick="adv('${o.id}','preparing')">START PREP →</button>`
      :o.st==='preparing'?`<button class="btn s" onclick="adv('${o.id}','ready')">MARK READY →</button>`
      :`<button class="btn s" style="background:var(--ok)" onclick="adv('${o.id}','completed')">HANDED OVER ✓</button>`}
    </div></div>`).join(''):'<div class="empty" style="grid-column:1/-1"><b>No live orders</b>You are all caught up.</div>'}
  </div>
  <h3 style="font-size:16px;font-weight:700;margin:28px 0 12px">Menu &amp; stock</h3>
  ${canFlash(v)?`<p class="xs" style="background:#FFF6E8;color:#B57A12;padding:9px 12px;border-radius:8px;margin-bottom:12px">Closing soon — you can flash-discount surplus stock below.</p>`
   :`<p class="xs mut" style="margin-bottom:12px">Flash discounts unlock in the last 45 minutes before ${v.close}.</p>`}
  <div class="card" style="padding:6px 16px;max-height:380px;overflow:auto">
   ${allItems(v).map(i=>`<div class="row sp" style="padding:9px 0;border-bottom:1px solid var(--line)">
    <span class="sm"><span class="dot ${i.t==='veg'?'veg':i.t==='egg'?'egg':'nv'}" style="vertical-align:-2px"></span>
     <span style="margin-left:6px">${esc(i.n)}</span> <span class="xs mut">₹${i.sm||i.p}</span>
     ${disc(i.k)?`<span class="pill" style="background:#FFECEC;color:var(--red)">${disc(i.k)}% off</span>`:''}</span>
    <span class="row" style="gap:6px">
     ${canFlash(v)?`<button class="cat" onclick="flash('${i.k}')">${disc(i.k)?'End':'10% off'}</button>`:''}
     <button class="cat ${DB.unavail[i.k]?'':'on'}" onclick="stock('${i.k}')">${DB.unavail[i.k]?'Sold out':'Available'}</button>
    </span></div>`).join('')}
  </div>
  ${sold.length?`<h3 style="font-size:16px;font-weight:700;margin:26px 0 10px">Top sellers today</h3>
   <div class="card" style="padding:6px 16px">${sold.map(s=>`<div class="row sp sm" style="padding:8px 0"><span>${esc(s[0])}</span><b>${s[1]}</b></div>`).join('')}</div>`:''}
 </div>`)}

function kitchen(){
 const v=ven(S.cafe);
 const q=DB.orders.filter(o=>o.v===v.id&&['placed','preparing'].includes(o.st)).sort((a,b)=>a.at-b.at);
 const urgent=q.filter(o=>(now()-o.at)/60000>=10).length;
 return cafeShell(`<div class="wrap" style="padding-top:18px;padding-bottom:60px">
  <div class="row" style="gap:8px;margin-bottom:16px">
   <span class="pill" style="background:#F4F1EB;font-size:13px">${q.length} on the pass</span>
   ${urgent?`<span class="pill" style="background:#FFECEC;color:var(--red);font-size:13px">${urgent} overdue</span>`:''}
  </div>
  <div class="kds">${q.length?q.map(o=>{
   const m=(now()-o.at)/60000,cls=m>=10?'red':m>=5?'amber':'';
   return `<div class="kcard ${cls}">
    <div class="row sp"><h3>${o.tok}</h3><b style="font-size:19px">${Math.floor(m)}′</b></div>
    ${o.head?`<div class="pill" style="background:#FFF6E8;color:#B57A12;margin:6px 0">🚶 student on the way</div>`:''}
    <div style="margin-top:8px">${o.it.map((i,ix)=>`<div class="kitem ${i.done?'done':''}" onclick="tick('${o.id}',${ix})">
      <span>${esc(i.n)}${i.sm?' ('+(i.sz==='lg'?'L':'S')+')':''}</span><b>× ${i.q}</b></div>`).join('')}</div>
    <p class="xs mut" style="margin-top:9px">Tap an item when it's plated. All done → order flips to Ready.</p>
   </div>`}).join(''):'<div class="empty" style="grid-column:1/-1"><b>Nothing to cook</b>The pass is clear.</div>'}</div>
 </div>`)}

/* ══════════════════ ACTIONS ══════════════════ */
function studentLogin(){
 const e=$('#em').value.trim().toLowerCase();
 if(!e.endsWith('@vitbhopal.ac.in')){$('#er').textContent='Use your @vitbhopal.ac.in address.';return}
 const raw=e.split('@')[0].split('.')[0];
 S.user={em:e,name:raw.charAt(0).toUpperCase()+raw.slice(1)};
 localStorage.setItem(K+'.user',JSON.stringify(S.user));go('home')}
function logout(){S.user=null;S.cart=[];localStorage.removeItem(K+'.user');go('landing')}
function cafeLogin(){
 if($('#cp').value!=='cafe123'){toast('Wrong passcode');return}
 S.cafe=$('#cf').value;localStorage.setItem(K+'.cafe',S.cafe);S.panel='counter';go('counter')}
function cafeOut(){S.cafe=null;localStorage.removeItem(K+'.cafe');go('landing')}

function find(k){for(const v of V)for(const i of allItems(v))if(i.k===k)return i}
function add(k){
 const i=find(k);
 if(S.cart.length&&S.cart[0].v!==i.v){
   if(!confirm('Your cart has items from '+ven(S.cart[0].v).name+'. Clear it and start here?'))return;
   S.cart=[]}
 S.cart.push(Object.assign({},i,{q:1,sz:'sm'}));render()}
function bump(k,d){
 const c=S.cart.find(x=>x.k===k);if(!c)return;
 c.q+=d;if(c.q<1)S.cart=S.cart.filter(x=>x.k!==k);render()}
function setSize(k,sz){const c=S.cart.find(x=>x.k===k);if(c){c.sz=sz}else{const i=find(k);S.cart.push(Object.assign({},i,{q:1,sz}))}render()}

function placeOrder(){
 const v=ven(S.cart[0].v);
 const bad=S.cart.filter(c=>DB.unavail[c.k]);
 if(bad.length){toast(bad[0].n+' just sold out — removed');S.cart=S.cart.filter(c=>!DB.unavail[c.k]);render();return}
 const e=estimate(v.id,S.cart);
 DB.seq[v.id]=(DB.seq[v.id]||0)+1;
 const pre={underbelly:'UB','mayuri-ab':'MAB',dakshin:'DK','bistro-safal':'BSF'}[v.id];
 const o={id:'o'+now()+Math.floor(Math.random()*99),v:v.id,u:S.user.em,un:S.user.name,
  tok:pre+'-'+String(DB.seq[v.id]).padStart(3,'0'),at:now(),st:'placed',w0:e.start,w1:e.end,head:false,
  it:S.cart.map(c=>({n:c.n,q:c.q,sz:c.sz,sm:c.sm,t:c.t,prep:c.prep,k:c.k,pr:eff(c,c.sz),done:false})),
  tot:S.cart.reduce((a,c)=>a+eff(c,c.sz)*c.q,0)};
 DB.orders.push(o);save();S.cart=[];go('track',{oid:o.id})}

function adv(id,st){const o=DB.orders.find(x=>x.id===id);o.st=st;if(st==='ready')o.it.forEach(i=>i.done=true);save();render()}
function tick(id,ix){
 const o=DB.orders.find(x=>x.id===id);o.it[ix].done=!o.it[ix].done;
 if(o.it.every(i=>i.done))o.st='ready';else if(o.st==='ready')o.st='preparing';
 else if(o.st==='placed')o.st='preparing';
 save();render()}
function heading(id){const o=DB.orders.find(x=>x.id===id);o.head=true;save();toast('Kitchen notified');render()}
function rate(oid,k,val){DB.reviews[oid+'|'+k]=val;save();toast('Thanks for the feedback');render()}
function stock(k){DB.unavail[k]=!DB.unavail[k];save();render()}
function flash(k){DB.flash[k]=DB.flash[k]?0:10;save();toast(DB.flash[k]?'10% off is now live for students':'Discount ended');render()}
function toggleClosed(){DB.closed[S.cafe]=!DB.closed[S.cafe];save();render()}

/* ══════════════════ RENDER ══════════════════ */
function render(){
 let h;
 if(S.cafe&&['counter','kitchen'].includes(S.route))h=S.panel==='counter'?counter():kitchen();
 else if(S.route==='landing')h=landing();
 else if(S.route==='auth')h=auth();
 else if(!S.user)h=auth();
 else if(S.route==='home')h=home();
 else if(S.route==='menu')h=menu();
 else if(S.route==='cart')h=cart();
 else if(S.route==='track')h=track();
 else if(S.route==='orders')h=orders();
 else h=home();
 $('#app').innerHTML=h}

if(S.cafe)go('counter');else if(S.user)go('home');else render();
setInterval(()=>{if(S.cafe||['track','orders','home'].includes(S.route))render()},15000);
</script>
</body>
</html>
